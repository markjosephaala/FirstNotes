<div class="container-fluid login-page-container">
  <div class="row min-vh-100 align-items-center">
    
    <!-- COLUMNA IZQUIERDA: LOGO Y SLOGAN -->
    <div class="col-md-6 d-flex flex-column justify-content-center align-items-center text-center left-branding-section">
      <div class="branding-wrapper">
        <!-- TODO: reemplazar URL -->
        <img src="assets/logo.png" alt="Logo" class="login-logo mb-4">
        <h1 class="display-4 fw-bold text-white">FirstNotes</h1>
        <p class="lead text-white-50">La teoría musical se aprende fácil</p>
      </div>
    </div>

    <!-- COLUMNA DERECHA: FORMULARIO -->
    <div class="col-md-6 d-flex justify-content-center align-items-center right-form-section">
      <div class="card login-card shadow-lg">
        <div class="card-body p-5">
          <h2 class="card-title text-center mb-4 login-title">Iniciar Sesión</h2>

          <div *ngIf="mensajeExito" class="alert alert-success">{{ mensajeExito }}</div>
          <div *ngIf="mensajeError" class="alert alert-danger">{{ mensajeError }}</div>

          <form (ngSubmit)="onLogin()" #loginForm="ngForm">
            <div class="mb-4">
              <label for="email" class="form-label">Correo Electrónico</label>
              <input type="email" class="form-control custom-input" id="email" name="email" 
                     [(ngModel)]="credenciales.email" required placeholder="ejemplo@correo.com">
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" class="form-control custom-input" id="password" name="password" 
                     [(ngModel)]="credenciales.password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-custom-submit w-100 py-2.5 mt-2" [disabled]="!loginForm.form.valid">
              Entrar
            </button>
            
            <p class="text-center mt-4 mb-0 register-text">
              ¿No tienes cuenta? <a routerLink="/registro" class="register-link">Regístrate aquí</a>
            </p>
          </form>
        </div>
      </div>
    </div>

  </div>
</div>
