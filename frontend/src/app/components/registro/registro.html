<div class="container-fluid login-page-container">
  <div class="row min-vh-100 align-items-center m-0">
    
    <div class="col-md-6 d-flex flex-column justify-content-center align-items-center text-center left-branding-section">
      <div class="branding-wrapper">
        <img src="assets/logo.png" alt="Logo" class="login-logo mb-4">
        <h1 class="display-4 fw-bold text-white">Únete a Nosotros</h1>
        <p class="lead text-white-50">Crea tu cuenta en un minuto y empieza a disfrutar de todas nuestras ventajas.</p>
      </div>
    </div>

    <div class="col-md-6 d-flex justify-content-center align-items-center right-form-section">
      <div class="card login-card shadow-lg">
        <div class="card-body p-5">
          <h2 class="card-title text-center mb-4 login-title">Crear Cuenta</h2>

          <div *ngIf="mensajeExito" class="alert alert-success">{{ mensajeExito }}</div>
          <div *ngIf="mensajeError" class="alert alert-danger">{{ mensajeError }}</div>

          <form (ngSubmit)="onSubmit()" #registroForm="ngForm">
            
            <div class="mb-4">
              <label for="nombre" class="form-label">Nombre Completo</label>
              <input type="text" class="form-control custom-input" id="nombre" name="nombre" 
                     [(ngModel)]="usuario.nombre" required placeholder="Tu nombre y apellidos">
            </div>

            <div class="mb-4">
              <label for="email" class="form-label">Correo Electrónico</label>
              <input type="email" class="form-control custom-input" id="email" name="email" 
                     [(ngModel)]="usuario.email" required placeholder="ejemplo@correo.com">
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" class="form-control custom-input" id="password" name="password" 
                     [(ngModel)]="usuario.password" required placeholder="Crea una contraseña segura">
            </div>

            <button type="submit" class="btn btn-custom-submit w-100 py-2.5 mt-2" [disabled]="!registroForm.form.valid">
              Registrarse
            </button>
            
            <p class="text-center mt-4 mb-0 register-text">
              ¿Ya tienes cuenta? <a routerLink="/login" class="register-link">Inicia sesión aquí</a>
            </p>
          </form>

        </div>
      </div>
    </div>

  </div>
</div>
