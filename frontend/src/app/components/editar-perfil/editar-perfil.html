<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-primary">
        <div class="card-body p-5">
          
          <h1 class="card-title text-primary text-center mb-3">¡Bienvenido, {{ nombre }}!</h1>
          <p class="text-muted text-center mb-4">Modifica los datos de tu cuenta desde aquí.</p>
          
          <div *ngIf="mensajeExito" class="alert alert-success">{{ mensajeExito }}</div>
          <div *ngIf="mensajeError" class="alert alert-danger">{{ mensajeError }}</div>

          <form (ngSubmit)="onGuardarCambios()">
            <div class="mb-3">
              <label for="usernameInput" class="form-label fw-bold">Cambiar Nombre de Usuario</label>
              <input type="text" class="form-control" id="usernameInput" name="nuevoNombre" 
                     [(ngModel)]="nuevoNombre" required>
            </div>

            <button type="submit" class="btn btn-primary w-100" [disabled]="nuevoNombre === nombre || !nuevoNombre">
              Guardar Cambios
            </button>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
